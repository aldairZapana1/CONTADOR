name: Build Android APK
 
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
 
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf automake autoconf-archive \
            libtool libltdl-dev \
            pkg-config gettext \
            build-essential \
            zlib1g-dev \
            libncurses-dev libtinfo-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            ccache \
            m4
 
      - name: Install Python build tools
        run: |
          pip install --upgrade "pip<24.0" "setuptools<69" "cython<3.0.0"
          pip install buildozer
 
      - name: Pin pip version globally (avoid broken pip 26.x)
        run: |
          echo "pip<25" > /tmp/pip-constraint.txt
          echo "PIP_CONSTRAINT=/tmp/pip-constraint.txt" >> $GITHUB_ENV
 
      - name: Build with Buildozer
        run: |
          yes | buildozer -v android debug
 
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mi-app-apk
          path: bin/*.apk
