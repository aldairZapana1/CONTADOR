name: Build Android APK
 
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
 
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libtool automake autoconf pkg-config gettext build-essential openjdk-17-jdk unzip zip git zlib1g-dev
          pip install "pip<24.0" "setuptools<69" "cython<3.0.0" buildozer
 
      - name: Build with Buildozer
        run: |
          yes | buildozer -v android debug
 
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mi-app-apk
          path: bin/*.apk
